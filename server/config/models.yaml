# 模型注册表 — 声明可用的 LLM provider（Key 不在此文件，经 apiKeyEnv/keyPool 引用环境变量）
# keyPool: true → 池前缀 = apiKeyEnv + '_'，每个 model 独立成池（切模型即切池）
# 运行时池优先、池空回退单 Key（apiKeyEnv）
# enabled: 模型开关。enabled: false → 完全隐藏（不出现在列表/不可解析，相当于下线）
default: deepseek
models:
  deepseek:
    displayName: DeepSeek
    baseUrl: https://api.deepseek.com/anthropic
    modelId: deepseek-v4-flash      # DeepSeek Anthropic 端点当前接受的模型串（生产已验证）
    smallFastModel: deepseek-v4-flash
    enabled: true                   # 模型开关（省略默认启用）
    keyPool: true                   # 池 DEEPSEEK_API_KEY_N 轮换
    apiKeyEnv: DEEPSEEK_API_KEY     # 单 Key 兜底（池空时用）
  kimi:
    displayName: Kimi K2
    baseUrl: https://api.moonshot.ai/anthropic
    modelId: kimi-k2.7-code
    smallFastModel: kimi-k2.5
    enabled: true                   # 模型开关（省略默认启用）
    keyPool: true                   # 池 KIMI_API_KEY_N 轮换（独立于 deepseek 池）
    apiKeyEnv: KIMI_API_KEY         # 单 Key 兜底（池空时用）
