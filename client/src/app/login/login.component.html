<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-slate-50">
  <!-- ===== 背景装饰 ===== -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-32 -right-32 w-[640px] h-[640px] rounded-full bg-glow-indigo">
    </div>
    <div class="absolute -bottom-24 -left-24 w-[560px] h-[560px] rounded-full bg-glow-violet">
    </div>
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-indigo-200/40 to-transparent"></div>
    <div class="absolute top-[30%] left-0 w-full h-px bg-gradient-to-r from-transparent via-slate-200/60 to-transparent"></div>
    <div class="absolute bottom-[28%] left-0 w-full h-px bg-gradient-to-r from-transparent via-slate-200/40 to-transparent"></div>
    <div class="absolute left-[12%] top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-indigo-100/50 to-transparent"></div>
    <div class="absolute right-[12%] top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-indigo-100/50 to-transparent"></div>
    <div class="absolute bottom-20 left-20 w-8 h-px bg-indigo-300/40"></div>
    <div class="absolute bottom-20 left-20 w-px h-8 bg-indigo-300/40"></div>
    <div class="absolute top-20 right-20 w-8 h-px bg-indigo-300/40"></div>
    <div class="absolute top-20 right-20 w-px h-8 bg-indigo-300/40"></div>
    <div class="absolute inset-0 opacity-[0.025] bg-grid-indigo"></div>
  </div>

  <!-- ===== 主内容区 ===== -->
  <div
    class="relative z-10 w-full max-w-[400px] mx-auto px-6"
    [class.opacity-100]="mounted()"
    [class.opacity-0]="!mounted()"
    [class.translate-y-0]="mounted()"
    [class.translate-y-4]="!mounted()"
  >
    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="inline-flex mb-5">
        <div class="w-12 h-12 rounded-xl icon-box icon-box-lg bg-gradient-to-br from-indigo-500 to-violet-500
                    shadow-lg shadow-indigo-500/20"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a4 4 0 0 1 4 4c0 2-1 3.5-2 5a6 6 0 0 0-2-5c-1-1.5-2-3-2-5a4 4 0 0 1 4-4z"/>
            <path d="M8 16c0-2 1-3 2-4a6 6 0 0 1 4 0c1 1 2 2 2 4"/>
            <path d="M6 20c0-2 1-3 2-4"/>
            <path d="M18 20c0-2-1-3-2-4"/>
            <path d="M4 22c0-2 .5-4 2-5"/>
            <path d="M20 22c0-2-.5-4-2-5"/>
          </svg>
        </div>
      </div>

      <h1 class="text-[28px] font-bold text-gray-900 tracking-tight">Oceanus</h1>

      <p class="mt-4 text-[15px] text-gray-400 leading-relaxed">
        让 AI 成为你的
        <span class="text-indigo-500 font-medium"> 数字分身</span>
        <span
          class="inline-block w-[2px] h-[17px] bg-indigo-400 ml-1 align-middle transition-opacity"
          [style.opacity]="cursorVisible() ? 1 : 0"
        ></span>
      </p>
    </div>

    <!-- 登录卡片 -->
    <div class="bg-white rounded-2xl p-8 border border-gray-100/80 shadow-card-indigo">
      <div class="space-y-5">
        <div class="text-center">
          <h2 class="text-lg font-semibold text-gray-900">欢迎回来</h2>
        </div>

        <form class="space-y-3.5">
          <!-- 用户名 -->
          <div class="relative">
            <div
              class="absolute left-3.5 top-1/2 -translate-y-1/2 z-10 transition-colors duration-300"
              [class.text-indigo-500]="focusedField() === 'username'"
              [class.text-gray-300]="focusedField() !== 'username'"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <input
              pInputText
              class="w-full !pl-10 !pr-4 !py-3 !text-sm !bg-gray-50 !border
                     !rounded-xl !text-gray-900 !placeholder:text-gray-300
                     !outline-none !transition-all !duration-300"
              [class.!border-indigo-300]="focusedField() === 'username'"
              [class.!bg-white]="focusedField() === 'username'"
              [class.!ring-3]="focusedField() === 'username'"
              [class.!ring-indigo-500/10]="focusedField() === 'username'"
              [class.!border-gray-100]="focusedField() !== 'username'"
              [class.hover:!border-gray-200]="focusedField() !== 'username'"
              placeholder="用户名"
              [formField]="loginForm.username"
              (focus)="focusedField.set('username')"
              (blur)="focusedField.set(null)"
              autocomplete="username"
              data-testid="login-username"
            />
          </div>

          <!-- 密码 -->
          <div class="relative">
            <div
              class="absolute left-3.5 top-1/2 -translate-y-1/2 z-10 transition-colors duration-300"
              [class.text-indigo-500]="focusedField() === 'password'"
              [class.text-gray-300]="focusedField() !== 'password'"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </div>
            <input
              pInputText
              type="password"
              class="w-full !pl-10 !pr-4 !py-3 !text-sm !bg-gray-50 !border
                     !rounded-xl !text-gray-900 !placeholder:text-gray-300
                     !outline-none !transition-all !duration-300"
              [class.!border-indigo-300]="focusedField() === 'password'"
              [class.!bg-white]="focusedField() === 'password'"
              [class.!ring-3]="focusedField() === 'password'"
              [class.!ring-indigo-500/10]="focusedField() === 'password'"
              [class.!border-gray-100]="focusedField() !== 'password'"
              [class.hover:!border-gray-200]="focusedField() !== 'password'"
              placeholder="密码"
              [formField]="loginForm.password"
              (focus)="focusedField.set('password')"
              (blur)="focusedField.set(null)"
              autocomplete="current-password"
              data-testid="login-password"
            />
          </div>

          <!-- 错误提示 -->
          @if (error()) {
            <div class="text-[13px] text-red-500 bg-red-50 border border-red-100
                        px-4 py-2.5 rounded-lg animate-fade-in flex items-center gap-2">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              {{ error() }}
            </div>
          }

          <!-- 登录按钮 -->
          <div class="mt-1">
            <p-button
              (click)="login()"
              [disabled]="loading()"
              styleClass="w-full btn-gradient"
              [loading]="loading()"
              data-testid="login-submit"
            >
              @if (!loading()) {
                登 录
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" class="ml-1">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
              }
            </p-button>
          </div>
        </form>

        <!-- 底部提示 -->
        <div class="pt-1">
          <div class="flex items-center gap-3">
            <div class="flex-1 h-px bg-gray-100"></div>
            <span class="text-[11px] text-gray-300 whitespace-nowrap">
              Demo: pm / 123456
            </span>
            <div class="flex-1 h-px bg-gray-100"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <p class="text-center text-[11px] text-gray-300 mt-8">
      &copy; 2025 Oceanus &middot; AI Product Workbench
    </p>
  </div>
</div>
