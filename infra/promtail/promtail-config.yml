# Oceanus Promtail Configuration
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            msg: msg
            traceId: traceId
      - labels:
          level:
      - static_labels:
          service: server
          container: oceanus-server

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /oceanus-server
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
        regex: /(.+)
        replacement: $1
